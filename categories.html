<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop by Category | FreshMart</title><link rel="stylesheet" href="css/style.css"><script src="js/products.js" defer></script><script src="js/common.js" defer></script><script defer>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('all-categories').innerHTML=CATEGORIES.map(c=>`<a class="category-card" href="shop.html?category=${encodeURIComponent(c.name)}"><div class="category-photo">${imageMarkup(c.image,c.name)}<span class="category-emoji">${c.icon}</span></div><div class="category-copy"><h3>${c.name}</h3><p>${c.description}</p></div></a>`).join('')});</script></head><body><div id="site-header"></div><main><section class="page-heading"><div class="container"><span class="eyebrow">A place for every favourite</span><h1>Shop by category</h1><p>Choose a category to see matching products in our shop.</p></div></section><section class="section"><div class="container"><div class="category-grid" id="all-categories"></div><div style="text-align:center;margin-top:32px"><a class="btn" href="shop.html">View all products →</a></div></div></section></main><div id="site-footer"></div></body></html>
